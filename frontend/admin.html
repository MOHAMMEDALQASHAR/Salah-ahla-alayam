<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - أحلى الأيام</title>
    <link rel="stylesheet" href="/static/styles.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div id="loginSection" class="hero" style="height: 100vh;">
        <div class="booking-form" style="width: 100%; max-width: 400px;">
            <h2 style="text-align: center; margin-bottom: 20px;">تسجيل الدخول</h2>
            <div id="loginMessage" class="message"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label>اسم المستخدم</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn" style="width: 100%;">دخول</button>
            </form>
        </div>
    </div>

    <div id="dashboardSection" class="admin-layout" style="display: none;">
        <div class="sidebar">
            <h3 class="logo" style="text-align: center; font-size: 1.2rem;">لوحة التحكم</h3>
            <ul class="sidebar-menu">
                <li><a href="#" class="active" onclick="showTab('bookings')">الحجوزات</a></li>
                <li><a href="#" onclick="showTab('gallery')">معرض الصور</a></li>
                <li><a href="#" onclick="showTab('settings')">الإعدادات</a></li>
                <li><a href="#" onclick="logout()" style="color: var(--error);">تسجيل خروج</a></li>
            </ul>
        </div>
        <div class="admin-content">
            <!-- Bookings Tab -->
            <div id="tab-bookings" class="tab-content">
                <h2>إدارة الحجوزات</h2>
                <table id="bookingsTable">
                    <thead>
                        <tr>
                            <th>التاريخ</th>
                            <th>اسم العميل</th>
                            <th>رقم الهاتف</th>
                            <th>رقم البطاقة</th>
                            <th>نوع المناسبة</th>
                            <th>الحالة</th>
                            <th>الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <!-- Gallery Tab -->
            <div id="tab-gallery" class="tab-content" style="display: none;">
                <h2>إدارة معرض الصور</h2>
                <div class="booking-form" style="margin: 20px 0;">
                    <form id="uploadForm">
                        <div class="form-group">
                            <label>رفع صورة جديدة</label>
                            <input type="file" id="imageFile" accept="image/*" required>
                        </div>
                        <button type="submit" class="btn">رفع</button>
                    </form>
                </div>
                <div class="gallery-grid" id="adminGallery"></div>
            </div>

            <!-- Settings Tab -->
            <div id="tab-settings" class="tab-content" style="display: none;">
                <h2>إدارة الإعدادات</h2>
                <div class="booking-form" style="margin-top: 20px;">
                    <div id="settingsMessage" class="message"></div>
                    <form id="settingsForm">
                        <div class="form-group">
                            <label>السعر اليومي</label>
                            <input type="text" id="setDailyPrice" required>
                        </div>
                        <div class="form-group">
                            <label>رقم التواصل</label>
                            <input type="text" id="setContactPhone" required>
                        </div>
                        <button type="submit" class="btn">حفظ الإعدادات</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/admin.js?v=3"></script>
</body>

</html>
